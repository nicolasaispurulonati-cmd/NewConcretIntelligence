# PostgreSQL para desarrollo local y para las pruebas de integración.
#
#   npm run db:local     levantar y esperar a que acepte conexiones
#   npm run db:down      detener (los datos se conservan en el volumen)
#   npm run db:reset     detener y borrar los datos
#   npm run db:logs      ver la salida del servidor
#
# Las credenciales son deliberadamente triviales y valen sólo para esta base
# local.

services:
  postgres:
    # La imagen oficial de pgvector trae la extensión ya compilada, que es la
    # parte difícil de resolver en Windows. `pg_trgm` y `unaccent` vienen en el
    # contrib estándar, así que las tres que usa el esquema están disponibles.
    image: pgvector/pgvector:pg17
    container_name: nci-postgres
    restart: unless-stopped

    # El marcador que identifica a esta base como de pruebas.
    #
    # Las pruebas de integración borran lo que crean y crean lo que necesitan.
    # Contra una base con datos reales eso es destructivo, y hoy no puede pasar
    # sólo porque todavía no hay ninguna desplegada. El arnés exige este
    # parámetro y se niega a correr sin él.
    #
    # Es configuración del servidor y no un dato: sobrevive a `db:reset`, la
    # aplicación no puede escribirlo, y un PostgreSQL gestionado no lo tiene.
    # Ponerlo en producción exige un acto deliberado, que es exactamente la
    # diferencia que se busca contra el accidente.
    command: postgres -c nci.entorno=pruebas

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

      # Sin locale a medida, deliberadamente.
      #
      # Pedir `es_AR.UTF-8` haría fallar el primer arranque: ese locale no está
      # generado en la imagen, e `initdb` aborta. Para ordenar en español no
      # hace falta configurarlo acá — PostgreSQL registra las colaciones de ICU
      # al inicializarse, así que se pide donde importa:
      #
      #   ORDER BY display_name COLLATE "es-AR-x-icu"
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'

    ports:
      # Mismo puerto que la base embebida: sólo una de las dos a la vez.
      - '5432:5432'

    volumes:
      - nci-postgres-data:/var/lib/postgresql/data

    healthcheck:
      # Las migraciones fallan si arrancan antes de que el servidor acepte
      # conexiones. Con esto, `docker compose up --wait` espera lo necesario en
      # lugar de que el script siguiente falle por llegar temprano.
      #
      # `pg_isready` sin host consulta por socket local y responde afirmativo
      # durante la inicialización, cuando todavía no acepta TCP. Con -h se
      # comprueba el mismo camino que usa la aplicación.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  nci-postgres-data:
    name: nci-postgres-data
